[project]
name = "text2sql-agent"
version = "0.2.0"
description = "A guarded local business analytics agent for the Olist MySQL dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-chroma>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pymysql>=1.1.0",
    "pypdf>=6.0.0",
    "python-docx>=1.1.0",
    "sqlglot>=26.0.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
olist-agent = "text2sql_agent.cli:main"
olist-index = "text2sql_agent.ingestion:main"

[tool.setuptools.packages.find]
include = ["text2sql_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
